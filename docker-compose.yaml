version: '3.8'

services:
  api:
    build: .
    command: /app/api
    ports:
      - "8080:8080"
    environment:
      - HTTP_PORT=8080
      - DB_URL=postgres://stream_user:stream_pass@postgres:5432/stream_db?sslmode=disable
      - KAFKA_BROKERS=kafka:9092
      - REDIS_ADDR=redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - stream-net

  worker:
    build: .
    command: /app/worker
    environment:
      - DB_URL=postgres://stream_user:stream_pass@postgres:5432/stream_db?sslmode=disable
      - KAFKA_BROKERS=kafka:9092
      - REDIS_ADDR=redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - stream-net

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: stream_user
      POSTGRES_PASSWORD: stream_pass
      POSTGRES_DB: stream_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    networks:
      - stream-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U stream_user -d stream_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - stream-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - stream-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - stream-net

networks:
  stream-net:


volumes:
  postgres_data:
  redis_data:
